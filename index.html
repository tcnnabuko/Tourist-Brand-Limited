<!DOCTYPE html>
<head>
<title> Tourist Brand Limited- Explore destinations for your holiday. </title>
<style>
body
 {
	background-color: #D9E8D3;
 }
header
 {
	background-color: yellow;
	display: flex;
	gap: 20px;
	padding: 30px;
	align-items: center;
	border-bottom-style: solid;
	border-color: gray;
 }
.subheader
 {
	background-color: #3FA314;
	text-align: center;
	padding: 100px;
	color: white;

 }
nav
 {
	display: flex;
	margin-left: auto;
	gap: 30px;
 }
nav a
 {
	display: inline-block;
	text-decoration: none;
	color: black;
	font-size: 25px;
	
 }
nav a:hover
 {
	color: orange;
 }
.dropdown {
	position:relative;
        display:inline-block;
}
.dropbtn {
	text-decoration: none;
	border: none;
	color: black;
	background-color: inherit;
	font-size: 25px;
}
.dropbtn:hover {
	color: orange;
}
.dropdown-items {
	display: none;
	background-color: #3FA314;
	position: absolute;
	
}
.dropdown-items a {
	display: block;
	position: relative;
	top: 100%;
	right: 0%;
	color: white;
	padding: 20px 30px;
}
.dropdown-items a:hover {
	color: black;
	background-color: blue;
}
.dropdown:hover .dropdown-items {
	display: block;
}
.cards {
	display: flex;
	max-width: 1000px;
	gap: 75px;
	margin: 30px;
	position: relative;
	left: 200px;
	top: 65px;
}
.cards a {
	text-decoration: none;
	color: black;
	background-color: white;
	text-align: center;
	width: 300px;
	height: 270px;
	border-radius: 20px;
}
.cards a img {
	height: 70%;
	width: 70%;
	object-fit: cover;
}
.cards a:hover {
	background-color: gray;
	color: white;
	transform: scale(0.8);
}
.cards a:hover h3 {
	text-decoration: underline;
}
footer {
	background-color: green;
	color: white;
	text-align: center;
	line-height: 0.4;
	padding: 10px;
	position: relative;
	top: 150px;
}
footer a {
	text-decoration: none;
	color: white;
}
footer a:hover {
	color: gray;
}
</style>
</head>
