<title> Tourist Brand Limited- Hong Kong. </title>
<style>
body
 {
	background-color: #D9E8D3;
	line-height: 2.0;
 }
header
 {
	background-color: yellow;
	display: flex;
	gap: 35px;
	padding: 30px;
	align-items: center;
 }

nav
 {
	display: flex;
	margin-left: auto;
	gap: 30px;
 }
nav a
 {
	display: inline-block;
	text-decoration: none;
	color: black;
	font-size: 25px;
 }
nav a:hover
 {
	color: orange;
	cursor: pointer;
 }
.dropdown {
	display: inline-block;
	background-color: inherit;
	position: relative;
}
.dropbtn {
	text-decoration: none;
	border: none;
	color: black;
	background-color: inherit;
	font-size: 25px;
}
.dropbtn:hover {
	color: orange;
}
.dropdown-items {
	display: none;
	background-color: #3FA314;
	position: absolute;
	
}
.dropdown-items a {
	display: block;
	position: relative;
	top: 100%;
	right: 0%;
	color: white;
	padding: 20px 30px;
}
.dropdown-items a:hover {
	color: black;
	background-color: blue;
}
.dropdown:hover .dropdown-items {
	display: block;
}
footer {
	background-color: green;
	color: white;
	text-align: center;
	line-height: 0.4;
	padding: 10px;
	position: relative;
	top: 150px;
}
footer a {
	text-decoration: none;
	color: white;
}
footer a:hover {
	color: gray;
}
</style>
